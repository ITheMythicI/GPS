<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Solutions / BIN - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/stylesIndex.css">
</head>

<body>
    <!-- ===Barra supeior con el logo ==== -->
    <header class="navbar">
        <div class="brand">
            NEXUS <span style="color:#4CAF50;"></span> SOLUTIONS
        </div>
        <ul>
            <li>
                <a href="index.html" style="text-decoration:none; color:#555;">Inicio</a>
            </li>
        </ul>
    </header>

    <!-- ===Lo verde, el logo y la imagen ==== -->

    <section class="registro">
        <!-- Formulario -->
        <div class="registro">
            <h3 id="titulo-form">INICIAR SESIÓN</h3>

            <form id="login-form" method="POST" action="login.php">
                <input type="email" name="email" placeholder="Email" required><br>
                <input type="password" name="password" placeholder="Contraseña" required><br>
                <button type="submit" class="registro">Entrar</button>
                <p style="margin-top:20px; font-size:14px;">
                    ¿No tienes cuenta? <a href="#" onclick="toggleForm('register')" style="color:#4CAF50;">Regístrate
                        aquí</a>
                </p>
            </form>

            <form id="registro-form" method="POST" action="registro.php" style="display:none;">
                <input type="text" name="nombre" placeholder="Nombre completo" required><br>
                <input type="email" name="email" placeholder="Email" required><br>
                <input type="password" name="password" placeholder="Contraseña" required><br>
                <button type="submit" class="registro">Crear Cuenta</button>
                <p style="margin-top:20px; font-size:14px;">
                    ¿Ya tienes cuenta? <a href="#" onclick="toggleForm('login')" style="color:#4CAF50;">Inicia sesión
                        aquí</a>
                </p>
            </form>
        </div>
    </section>

    <script>
        function toggleForm(type) {
            const loginForm = document.getElementById('login-form');
            const registroForm = document.getElementById('registro-form');
            const titulo = document.getElementById('titulo-form');

            if (type === 'register') {
                loginForm.style.display = 'none';
                registroForm.style.display = 'block';
                titulo.innerText = 'REGISTRO DE USUARIO';
            } else {
                loginForm.style.display = 'block';
                registroForm.style.display = 'none';
                titulo.innerText = 'INICIO DE SESIÓN';
            }
        }
    </script>

</body>

</html>
